on:
  push:
    branches:
      - main

jobs:
  build_css:
    runs-on: ubuntu-latest
    env:
      destination: assets/specs-2026/
    steps:
      - name: Checkout source Git branch
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24'

      - name: Install npm modules
        run: npm install

      - name: compile assets
        run: npm run build

      - name: Upload to incubation.w3.org bucket
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
        run:
          aws s3 sync --no-progress js s3://incubation.w3.org/${{ env.destination }}
          aws s3 sync --no-progress css s3://incubation.w3.org/${{ env.destination }}

